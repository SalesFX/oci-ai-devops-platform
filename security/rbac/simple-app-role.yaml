apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-app
  namespace: simple-app-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simple-app-read
  namespace: simple-app-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simple-app-read
  namespace: simple-app-prod
subjects:
  - kind: ServiceAccount
    name: simple-app
    namespace: simple-app-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simple-app-read
