apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-secure-pod-context
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Pods must run as non-root and disable privilege escalation.
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
