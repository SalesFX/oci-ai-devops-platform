apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: simple-app-local

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      env: local
    includeSelectors: true

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
    target:
      kind: Deployment
      name: simple-app

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.localhost
    target:
      kind: Ingress
      name: simple-app

images:
  - name: simple-app
    newName: simple-app
    newTag: local
