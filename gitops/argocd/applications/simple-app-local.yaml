apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-app-local
  namespace: argocd
spec:
  project: oci-devops
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitops/oci-ai-devops-platform.git
    targetRevision: main
    path: kubernetes/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-app-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
