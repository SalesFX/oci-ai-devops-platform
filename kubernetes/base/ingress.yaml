apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple-app
                port:
                  number: 80
  tls:
    - hosts:
        - app.example.com
      secretName: simple-app-tls
