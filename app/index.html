<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCI DevOps Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #edf2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: min(920px, calc(100vw - 32px));
      padding: 48px 0;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 14px;
      border: 1px solid #c74634;
      color: #ffb2a8;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.02;
      font-weight: 760;
      margin-bottom: 12px;
    }
    .subtitle {
      color: #a7b0bb;
      font-size: 18px;
      margin-bottom: 34px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 12px;
      max-width: 760px;
      margin: 0 auto;
    }
    .card {
      background: #141b24;
      border: 1px solid #253140;
      border-radius: 8px;
      padding: 18px 14px;
      min-height: 104px;
    }
    .icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      background: #c74634;
      color: #fff;
      font-weight: 800;
    }
    .card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .label {
      color: #8d99a6;
      font-size: 12px;
    }
    .env {
      margin-top: 28px;
      font-size: 12px;
      color: #7b8794;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">Oracle Cloud Infrastructure</div>
    <h1>OCI DevOps Platform</h1>
    <p class="subtitle">Kubernetes, GitOps, observability and security in one delivery blueprint.</p>
    <section class="grid" aria-label="Platform capabilities">
      <article class="card"><div class="icon">OK</div><strong>OKE</strong><div class="label">Kubernetes</div></article>
      <article class="card"><div class="icon">CD</div><strong>ArgoCD</strong><div class="label">GitOps</div></article>
      <article class="card"><div class="icon">GR</div><strong>Grafana</strong><div class="label">Dashboards</div></article>
      <article class="card"><div class="icon">VL</div><strong>Vault</strong><div class="label">Secrets</div></article>
      <article class="card"><div class="icon">CR</div><strong>OCIR</strong><div class="label">Registry</div></article>
      <article class="card"><div class="icon">SC</div><strong>Policies</strong><div class="label">Security</div></article>
    </section>
    <div class="env">
      ENV: <span id="env">-</span> | VERSION: <span id="version">-</span>
    </div>
  </main>
  <script>
    document.getElementById("env").textContent = "{{ENV}}";
    document.getElementById("version").textContent = "{{VERSION}}";
  </script>
</body>
</html>
